<rect x="94" y="108" width="50" height="46" rx="3" fill="none" stroke="#EF9F27" stroke-width="1" stroke-dasharray="4 2" opacity="0.6" style="fill:none;stroke:rgb(239, 159, 39);color:rgb(0, 0, 0);stroke-width:1px;stroke-dasharray:4px, 2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.6;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

