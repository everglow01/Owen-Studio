<script>
  // TOC clicks: replace history entry instead of pushing one,
  // so the browser back button returns to the previous page,
  // not the previous anchor.
  document.addEventListener('click', function (e) {
    var a = e.target.closest('#TableOfContents a[href^="#"]');
    if (!a) return;
    var id = decodeURIComponent(a.getAttribute('href').slice(1));
    var target = document.getElementById(id);
    if (!target) return;
    e.preventDefault();
    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    history.replaceState(null, '', '#' + id);
  });

  // Fill in view counts from GoatCounter for any [data-views-path] element.
  (function () {
    var nodes = document.querySelectorAll('[data-views-path]');
    nodes.forEach(function (el) {
      var path = el.getAttribute('data-views-path');
      var url = 'https://owen-studio.goatcounter.com/counter/' +
                encodeURIComponent(path) + '.json';
      fetch(url)
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) { el.textContent = d ? d.count : '0'; })
        .catch(function () { el.textContent = '0'; });
    });
  })();

  // Sync Giscus theme with Blowfish's html.dark toggle.
  (function () {
    function syncGiscusTheme() {
      var frame = document.querySelector('iframe.giscus-frame');
      if (!frame || !frame.contentWindow) return;
      var theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
      frame.contentWindow.postMessage(
        { giscus: { setConfig: { theme: theme } } },
        'https://giscus.app'
      );
    }
    // When the Giscus iframe finishes initializing it posts a message back.
    window.addEventListener('message', function (e) {
      if (e.origin !== 'https://giscus.app') return;
      if (e.data && e.data.giscus) syncGiscusTheme();
    });
    // When Blowfish toggles the dark class on <html>, push the new theme.
    new MutationObserver(syncGiscusTheme).observe(
      document.documentElement,
      { attributes: true, attributeFilter: ['class'] }
    );
  })();
</script>
